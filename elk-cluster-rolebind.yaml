apiVersion: v1
kind: ServiceAccount
metadata:
  name: elk-logging
  namespace: data-as-a-service-hl-global
  labels:
    app: elk-logging
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: elk-logging
  labels:
    app: elk-logging
rules:
- apiGroups: [""]
  resources: ["services", "namespaces", "endpoints"]
  verbs: ["get"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: data-as-a-service-hl-global
  name: elk-logging
  labels:
    app: elk-logging
subjects:
- kind: ServiceAccount
  name: elk-logging
  namespace: data-as-a-service-hl-global
  apiGroup: ""
roleRef:
  kind: ClusterRole
  name: elk-logging
  apiGroup: ""