apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-as-a-service-hl-global-cluster-role
  namespace: data-as-a-service-hl-global
rules:
- apiGroups: [""]
  resources: ["nodes", "services", "pods"]
  verbs: ["list", "get", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-as-a-service-hl-global-svc-acct
  namespace: data-as-a-service-hl-global
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hasura-pod-reader
  namespace: data-as-a-service-hl-global
subjects:
- kind: ServiceAccount
  name: data-as-a-service-hl-global-svc-acct
  namespace: data-as-a-service-hl-global
roleRef:
  kind: ClusterRole
  name: data-as-a-service-hl-global-cluster-role
  apiGroup: rbac.authorization.k8s.io
