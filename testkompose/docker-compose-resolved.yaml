name: testkompose
services:
  grafana:
    container_name: hge-grafana
    depends_on:
      prometheus:
        condition: service_started
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: HGEMonitoring!
    image: grafana/grafana:9.5.2
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
        volume: {}
      - type: bind
        source: /Users/ageng/Works/github/test-hasura/testkompose/grafana/dashboards
        target: /var/lib/grafana/dashboards
        bind:
          create_host_path: true
      - type: bind
        source: /Users/ageng/Works/github/test-hasura/testkompose/grafana/provisioning
        target: /etc/grafana/provisioning
        bind:
          create_host_path: true
  graphql-engine:
    container_name: hge
    depends_on:
      postgres:
        condition: service_started
        required: true
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: secret
      HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_EE_LICENSE_KEY: ""
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLED_APIS: metadata,graphql,config,metrics
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,query-log,websocket-log,response-caching-log
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HGE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/healthz
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 30s
    image: hasura/graphql-engine:v2.28.0.cli-migrations-v3
    labels:
      logging: promtail
      logging_jobname: graphql-engine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /Users/ageng/Works/github/test-hasura/testkompose/examples/hasura/migrations
        target: /hasura-migrations
        bind:
          create_host_path: true
      - type: bind
        source: /Users/ageng/Works/github/test-hasura/testkompose/examples/hasura/metadata
        target: /hasura-metadata
        bind:
          create_host_path: true
  loki:
    command:
      - -config.file=/etc/loki/local-config.yaml
    container_name: loki
    deploy:
      mode: global
    image: grafana/loki:2.8.2
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3100
        published: "3100"
        protocol: tcp
  postgres:
    container_name: hge-metadata-pg
    environment:
      POSTGRESQL_DATABASE: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_USERNAME: postgres
    image: bitnami/postgresql:15
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: db_data
        target: /bitnami/postgresql
        volume: {}
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    container_name: hge-prom
    deploy:
      mode: global
    image: prom/prometheus:v2.44.0
    networks:
      default: null
    ports:
      - mode: ingress
        target: 9090
        published: "9090"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /Users/ageng/Works/github/test-hasura/testkompose/prometheus
        target: /etc/prometheus
        bind:
          create_host_path: true
      - type: volume
        source: prometheus_data
        target: /prometheus
        volume: {}
  promtail:
    container_name: promtail
    depends_on:
      loki:
        condition: service_started
        required: true
    image: grafana/promtail:2.8.2
    networks:
      default: null
    restart: always
    volumes:
      - type: bind
        source: /Users/ageng/Works/github/test-hasura/testkompose/promtail/config.yaml
        target: /etc/promtail/config.yml
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /var/lib/docker/containers
        target: /var/lib/docker/containers
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: true
networks:
  default:
    name: testkompose_default
volumes:
  db_data:
    name: testkompose_db_data
  grafana_data:
    name: testkompose_grafana_data
  prometheus_data:
    name: testkompose_prometheus_data
